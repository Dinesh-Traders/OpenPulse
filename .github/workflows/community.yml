name: Community

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]
  schedule:
    - cron: '0 9 * * 1'  # Every Monday 9am — stale check

jobs:
  welcome:
    name: Welcome First-Time Contributors
    runs-on: ubuntu-latest
    if: github.event_name == 'issues' || github.event_name == 'pull_request'
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            Thanks for opening your first issue on OpenPulse!

            A maintainer will respond within 48 hours.
            While you wait, check out CONTRIBUTING.md and the good first issue list if you want to help build this project.
          pr-message: |
            Thanks for your first pull request on OpenPulse!

            A maintainer will review it within 5 days. Make sure your PR links an issue and the checklist in the PR template is filled in.
            We appreciate your contribution.

  stale:
    name: Mark Stale Issues and PRs
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: |
            This issue has been inactive for 14 days. It will be closed in 7 more days unless there is new activity.
            If you are working on this, please leave a comment.
          stale-pr-message: |
            This pull request has been inactive for 14 days. It will be closed in 7 more days unless there is new activity.
          close-issue-message: |
            Closed due to inactivity. Feel free to reopen if this is still relevant.
          close-pr-message: |
            Closed due to inactivity. Feel free to reopen if this is still relevant.
          days-before-stale: 14
          days-before-close: 7
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: pinned, security, in-review
          exempt-pr-labels: in-review
